<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/reset.css">
  <link rel="stylesheet" href="./style/style.css">
  <title>Document</title>
</head>
<body>
  <div class="forms-container">
    <form class="person-form" action="">
      <label for="fullname">Fullname</label>
      <input type="text" id="fullname" name="fullname"/>
      <label for="age">Age</label>
      <input type="number" id="age" name="age"/>
      <button class="create-person">Create</button>
    </form>
    <form class="car-form" action="">
      <label for="model">Model</label>
      <input type="text" id="model" name="model"/>
      <label for="color">Color</label>
      <input type="text" id="color" name="color"/>
      <label for="owner">Select owner</label>
      <select name="owner" id="owner"></select>
      <button class="create-car" disabled>Create</button>
    </form>
  </div>
  <script src="./script.js"></script>
</body>
</html>
