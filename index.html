<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./reset.css">
  <link rel="stylesheet" href="./style.css">
  <title>Document</title>
</head>
<body>
  <form class="house-form" action="">
    <h3>Create house:</h3>
    <label for="apartment-amount">Amount of apartments</label>
    <input type="number" id="apartment-amount" name="apartment-amount">
    <button id="house-btn" class="action-btn">Create</button>
  </form>

  <form class="apartment-form hidden" action="">
    <h3 class="apartment-number"></h3>
    <label for="resident-amount">Amount of residents</label>
    <input type="number" id="resident-amount" name="resident-amount">
    <button id="apartment-btn" class="action-btn">Next</button>
  </form>

  <form class="resident-form hidden" action="">
    <h3 id="resident-number"></h3>
    <button id="residents-btn" class="action-btn">Save apartment</button>
  </form>

  <button class="show-info action-btn hidden">Show house info</button>

  <div class="info-container hidden">
    <div class="info-modal">
        <h3 class="info-text"></h3>
        <button class="info-btn action-btn">OK</button>
    </div>
  </div>

  <template class="resident-input">
    <div>
      <label></label>
      <input type="text">
    </div>
  </template>

  <script src="./script.js"></script>
</body>
</html>
