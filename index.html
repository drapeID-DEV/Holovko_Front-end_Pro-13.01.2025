<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style/reset.css"/>
  <link rel="stylesheet" href="./style/style.css"/>
  <link rel="stylesheet" href="fonts/stylesheet.css"/>
  <title>HW 27</title>
</head>
<body>
  <h1>Users</h1>
  <table class="users-list">
    <tr>
      <th>ID</th>
      <th>Username</th>
      <th>User action</th>
    </tr>
    <template class="user-row-template">
      <tr>
        <td class="user-id"></td>
        <td class="username"></td>
        <td class="actions">
          <button class="action-btn view-btn">View</button>
          <button class="action-btn edit-btn">Edit</button>
          <button class="action-btn delete-btn">Delete</button>
        </td>
      </tr>
    </template>
  </table>
  <button class="action-btn add-user-btn">Add user</button>
  <div class="modal-container">
    <form class="modify-user-form" action="">
      <label for="username">Username</label>
      <input type="text" id="username" name="username"/>
      <label for="password">Password</label>
      <div class="password-block">
        <input type="password" id="password" name="password"/>
        <button class="hide-password" href="">
          <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4.35 12.7748C2.49166 11.5582 1.29166 9.72483 1.29166 8.1165C1.29166 5.38317 4.74166 2.03316 9 2.03316C10.7417 2.03316 12.3583 2.5915 13.6583 3.45816" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M15.5414 5.17516C16.2839 6.11683 16.7164 7.1585 16.7164 8.11683C16.7164 10.8502 13.2581 14.2002 8.99975 14.2002C8.24142 14.2002 7.50058 14.0918 6.80808 13.9002" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7.13808 9.9725C6.64225 9.48167 6.36475 8.8125 6.36725 8.115C6.36392 6.66083 7.54058 5.47917 8.99558 5.47667C9.69558 5.475 10.3673 5.7525 10.8623 6.2475" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M11.5912 8.58258C11.3962 9.65925 10.5537 10.5034 9.47708 10.7009" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path class="eye-line" d="M15.5764 1.54158L2.43141 14.6866" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <button class="action-btn confirm-modifying-btn">Confirm</button>
    </form>
    <div class="deleting-message">
      <h3>Do you want to delete user?</h3>
      <div class="btn-container">
        <button class="action-btn accept-delete">Yes</button>
        <button class="action-btn decline-delete">No</button>
      </div>
    </div>
  </div>
  <script src="./JS/script.js"></script>
</body>
</html>
