<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCoffe</title>
</head>
<body>
    <p class="text-center fs-1 fw-bold text-success m-3">Welcome to MyCoffe!</p>
    <div id="main-content" class="container d-flex">
        <div class="d-flex flex-column w-25 p-3 px-1 gap-3" id="category-btns-container">
            <button id="open-order-btn" type="button" class="btn btn-primary fs-3 fw-medium mb-5">Your order</button>
        </div>
        <div id="product-cards-container" class="d-grid gap-3 w-100 p-3 px-5 gap-3">
        </div>
    </div>
    <div id="order-container" class="d-none container text-center">
        <p id="order-price" class="text-center fs-1 fw-bold text-success m-3"></p>
        <div id="order-controls" class="d-flex w-100 justify-content-center">
            <button id="close-order-btn" type="button" class="btn btn-danger fs-3 fw-medium w-25 m-2">Close</button>
            <button id="proceed-order-btn" type="button" class="btn btn-success fs-3 fw-medium w-25 m-2">Proceed</button>
        </div>
    </div>
    <div id="constructor-container" class="d-none container">
        <p id="constructor-name" class="text-center fs-1 fw-bold text-success m-3">BigBoss</p>
        <div id="product-constructor" class="d-flex border border-secondary rounded p-3 justify-content-around">
            <img id="constructor-image" class="w-25" src="https://s7d1.scene7.com/is/image/mcdonalds/McD_Big-Mac:nutrition-calculator-tile" alt="">
            <div id="sizes-container" class="d-flex flex-column justify-content-center">
                <p class="text-center fs-3 text-success fw-bold">Size:</p>
                <div class="form-check fs-3">
                    <input class="form-check-input" type="radio" name="size-radio" value="SIZE_SMALL" checked>
                    <label class="form-check-label" for="size-radio">
                      Small
                    </label>
                </div>
                <div class="form-check fs-3">
                    <input class="form-check-input" type="radio" name="size-radio" value="SIZE_MEDIUM">
                    <label class="form-check-label" for="size-radio">
                      Medium
                    </label>
                </div>
                <div class="form-check fs-3">
                    <input class="form-check-input" type="radio" name="size-radio" value="SIZE_LARGE">
                    <label class="form-check-label" for="size-radio">
                      Large
                    </label>
                </div>
            </div>
            <div id="toppings-container" class="d-flex flex-column justify-content-center">
                <p class="text-center fs-3 text-success fw-bold">Toppings:</p>
                <div class="form-check form-switch fs-3">
                    <input class="form-check-input" type="checkbox" role="switch" name="topping-switch" value="TOPPING_MAYO">
                    <label class="form-check-label" for="switchCheckChecked">Mayo</label>
                </div>
                <div class="form-check form-switch fs-3">
                    <input class="form-check-input" type="checkbox" role="switch" name="topping-switch" value="TOPPING_SAUCE">
                    <label class="form-check-label" for="switchCheckChecked">Magic sauce</label>
                </div>
            </div>
        </div>
        <div id="constructor-buttons" class="mt-3 text-center">
            <button id="cancel-btn" type="button" class="btn btn-danger fs-3 fw-medium w-25">Cancel</button>
            <button id="add-btn" type="button" class="btn btn-success fs-3 fw-medium w-25">Add</button>
        </div>
    </div>
    <template class="category-btn-template">
        <button id="category-btn" type="button" class="btn btn-success fs-3 fw-medium"></button>
    </template>
    <template class="product-card-template">
        <div id="product-card" class="d-flex flex-column border border-secondary px-3 rounded pt-3">
            <img id="product-image" class="w-100" src="https://s7d1.scene7.com/is/image/mcdonalds/McD_Big-Mac:nutrition-calculator-tile" alt="">
            <div class="d-flex justify-content-between w-100 mt-3">
                <p id="product-name" class="fs-5 fw-medium">Cheesburger</p>
                <p id="product-price" class="fs-5 fw-bold text-success">90UAH</p>
            </div>
        </div>
    </template>
    <template class="cart-item-template">
        <div id="cart-item" class="d-flex w-100 border border-secondary rounded p-3 justify-content-around mb-5">
            <img id="cart-item-image" class="w-25" src="https://s7d1.scene7.com/is/image/mcdonalds/McD_Big-Mac:nutrition-calculator-tile" alt="">
            <div id="cart-item-size-container" class="d-flex flex-column justify-content-center">
                <p class="text-center fs-3 text-success fw-bold">Size:</p>
                <p id="cart-item-size" class="text-center fs-3 fw-bold"></p>
            </div>
            <div id="cart-item-toppings-container" class="d-flex flex-column justify-content-center">
                <p class="text-center fs-3 text-success fw-bold">Toppings:</p>
                <p id="cart-item-toppings" class="text-center fs-3 fw-bold"></p>
            </div>
            <div id="cart-item-price-container" class="d-flex flex-column justify-content-center">
                <p class="text-center fs-3 text-success fw-bold">Price:</p>
                <p id="cart-item-price" class="text-center fs-3 fw-bold"></p>
            </div>
            <button id="remove-btn" type="button" class="btn btn-danger fs-3 fw-medium w-25 h-25 my-auto">Remove</button>
        </div>
    </template>
</body>
</html>
